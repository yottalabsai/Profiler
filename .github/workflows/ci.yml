name: ci
on:
  pull_request:
  push:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          if [ -n "$BASE_SHA" ]; then
            # PR: only scan commits introduced by this PR
            ./gitleaks detect --source . --redact --no-banner --exit-code 1 --log-opts="$BASE_SHA..HEAD"
          else
            # push to default branch: scan current working tree
            ./gitleaks detect --source . --redact --no-banner --exit-code 1 --no-git
          fi

      - name: Block merge-conflict markers
        run: |
          if git grep -nE '^(<{7}|>{7}) ' -- ':!.github/**'; then
            echo "::error::merge conflict markers found"; exit 1
          fi

      - name: Block large files (>5MB)
        run: |
          big=$(git ls-files -z | xargs -0 -n1 -I{} stat -c '%s %n' '{}' | awk '$1>5242880 {print $2}')
          if [ -n "$big" ]; then echo "::error::large files committed:"; echo "$big"; exit 1; fi
